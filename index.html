<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Train/Fuel">
<meta name="theme-color" content="#F7F3E9">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Train / Fuel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap');

  :root {
    --bg: #F7F3E9;
    --surface: #FFFFFF;
    --surface-alt: #EEE5D0;
    --text: #2A3A5A;
    --text-dim: #7A8AA0;
    --accent: #2A3A5A;
    --accent-dim: #B0A080;
    --fuel: #B5622A;
    --danger: #B31E23;
    --border: #D8CBB0;
    --paper-line: #C9DCE8;
    --margin-rule: #E0A0A0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: 'Lora', Georgia, serif;
    -webkit-tap-highlight-color: transparent;
  }
  .display { font-family: 'Lora', Georgia, serif; font-weight: 600; }
  .mono { font-family: 'Courier New', monospace; font-variant-numeric: tabular-nums; }
  .handwritten { font-family: 'Kalam', cursive; }

  .shell { max-width: 720px; margin: 0 auto; padding: 20px 16px 90px; min-height: 100vh; }
  .top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; border-bottom: 1.5px solid var(--border); padding-bottom: 12px; }
  .top h1 { font-size: 24px; margin: 0; font-weight: 600; font-family: 'Lora', Georgia, serif; }
  .top .date { color: var(--text-dim); font-size: 12px; font-family: 'Lora', Georgia, serif; font-style: italic; }

  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1.5px solid var(--border); display: flex; justify-content: center; z-index: 20; padding-bottom: env(safe-area-inset-bottom); }
  .tabbar-inner { max-width: 720px; width: 100%; display: flex; }
  .tab-btn { flex: 1; background: none; border: none; color: var(--text-dim); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 4px; cursor: pointer; font-size: 12px; font-family: 'Lora', Georgia, serif; border-top: 2px solid transparent; }
  .tab-btn.active { color: var(--accent); border-top-color: var(--accent); font-weight: 600; }
  .tab-btn.active.fuel-active { color: var(--fuel); border-top-color: var(--fuel); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(42,58,90,0.06); }
  .card h2 { font-family: 'Lora', Georgia, serif; font-weight: 600; font-size: 15px; color: var(--text); margin: 0 0 12px; border-bottom: 1px solid var(--paper-line); padding-bottom: 8px; }

  .card-journal { background-image: repeating-linear-gradient(var(--surface) 0px, var(--surface) 23px, var(--paper-line) 24px); position: relative; padding-left: 30px; }
  .card-journal::before { content: ""; position: absolute; left: 22px; top: 0; bottom: 0; width: 1.5px; background: var(--margin-rule); }
  .card-journal h2 { background: var(--surface); display: inline-block; padding-right: 10px; border-bottom: none; margin-bottom: 4px; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-box { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 3px; padding: 12px; }
  .stat-box .num { font-family: 'Courier New', monospace; font-size: 20px; font-weight: 700; }
  .stat-box .lbl { color: var(--text-dim); font-size: 11px; margin-top: 2px; }

  .gauge-row { margin-bottom: 12px; }
  .gauge-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; color: var(--text-dim); }
  .gauge-head .val { font-family: 'Courier New', monospace; color: var(--text); }
  .gauge-track { height: 7px; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .gauge-fill { height: 100%; transition: width 0.3s ease; }

  button.action { background: var(--accent); color: var(--bg); border: none; font-family: 'Lora', Georgia, serif; font-weight: 600; font-size: 13px; padding: 10px 14px; border-radius: 3px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button.action.fuel { background: var(--fuel); }
  button.action.ghost { background: transparent; border: 1.5px solid var(--accent-dim); color: var(--text); }
  button.action:disabled { opacity: 0.4; }
  button.icon-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 4px; display: flex; align-items: center; font-size: 16px; font-family: 'Lora', serif; }
  button.icon-btn:active { color: var(--danger); }

  input, select, textarea { background: var(--surface-alt); border: 1px solid var(--border); color: var(--text); border-radius: 3px; padding: 8px 10px; font-family: 'Lora', Georgia, serif; font-size: 13px; width: 100%; }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text-dim); margin-bottom: 10px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }

  .plate-strip { display: flex; flex-wrap: wrap; gap: 6px; }
  .plate { background: var(--surface-alt); border: 1.5px solid var(--accent-dim); border-radius: 3px; min-width: 46px; height: 40px; padding: 0 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Courier New', monospace; }
  .plate .w { font-size: 12px; font-weight: 700; color: var(--accent); line-height: 1.3; }
  .plate .r { font-size: 9px; color: var(--text-dim); }
  .plate-target { border-style: dashed; border-color: var(--border); opacity: 0.75; }
  .plate-target .w { color: var(--text-dim); }

  .note-box { margin-top: 6px; padding: 7px 10px; background: var(--surface-alt); border-left: 2px solid var(--accent-dim); font-family: 'Kalam', cursive; font-size: 13px; color: #5a5040; font-style: italic; border-radius: 0 3px 3px 0; }

  .list-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--paper-line); }
  .list-item:last-child { border-bottom: none; }
  .empty { color: var(--text-dim); font-size: 13px; text-align: center; padding: 20px 8px; font-style: italic; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(42,58,90,0.35); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal { background: var(--bg); border: 1px solid var(--border); border-top: 3px solid var(--accent); border-radius: 8px 8px 0 0; padding: 18px 16px 24px; max-width: 720px; width: 100%; max-height: 85vh; overflow-y: auto; }
  .modal.fuel-modal { border-top-color: var(--fuel); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .modal-head h3 { font-family: 'Lora', Georgia, serif; font-weight: 600; margin: 0; font-size: 17px; }

  .day-btn { flex-direction: column; gap: 2px; font-size: 11px; padding: 8px 4px; position: relative; }
  .day-btn .muscle { display: block; font-size: 9px; opacity: 0.8; }
  .day-dot { position: absolute; top: -6px; right: -6px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------- Constants ----------
const DAYS = [
  { day: 1, muscle: "Push" },
  { day: 2, muscle: "Pull" },
  { day: 3, muscle: "Legs" },
  { day: 4, muscle: "Upper Body" },
];
const DAY_COLOR = { 1: "#2A3A5A", 2: "#B5622A", 3: "#4F6B3A", 4: "#6B3A50" };
const dayMuscle = (day) => (DAYS.find(d => d.day === day) || {}).muscle || "";

const SEED_EXERCISES = [
  { name: "Smith Machine Flat Bench Press", day: 1, target: "3×5–8" },
  { name: "Cable Crossover — High-to-Low", day: 1, target: "2×10–15" },
  { name: "Seated Dumbbell Shoulder Press", day: 1, target: "3×6–10" },
  { name: "Cable Lateral Raise", day: 1, target: "3×12–20" },
  { name: "Close-Grip Bench Press", day: 1, target: "" },
  { name: "Overhead Cable Triceps Extension", day: 1, target: "" },
  { name: "Chest-Supported Row", day: 2, target: "" },
  { name: "Supinated-Grip Lat Pulldown", day: 2, target: "" },
  { name: "Straight-Arm Cable Pulldown", day: 2, target: "" },
  { name: "Dumbbell High Pull", day: 2, target: "" },
  { name: "EZ-Bar Curl", day: 2, target: "" },
  { name: "Standing Dumbbell Curl", day: 2, target: "" },
  { name: "Face Pull", day: 2, target: "" },
  { name: "Hack Squat", day: 3, target: "" },
  { name: "Leg Press", day: 3, target: "" },
  { name: "Seated Leg Curl", day: 3, target: "" },
  { name: "Leg Extension", day: 3, target: "" },
  { name: "ISO Leg Extension (one at a time)", day: 3, target: "" },
  { name: "Standing Calf Raise", day: 3, target: "" },
  { name: "Seated Calf Raise", day: 3, target: "" },
  { name: "Leg Raise", day: 3, target: "" },
  { name: "Incline Dumbbell Press", day: 4, target: "" },
  { name: "Cable Crossover — Low-to-High", day: 4, target: "" },
  { name: "Single-Arm Cable Row", day: 4, target: "" },
  { name: "Neutral-Grip Lat Pulldown", day: 4, target: "" },
  { name: "Dumbbell Lateral Raise", day: 4, target: "" },
  { name: "Incline Dumbbell Curl", day: 4, target: "" },
  { name: "Triceps Pushdown", day: 4, target: "" },
].map(e => ({ id: uid(), ...e }));

// Foods get added here as you tell them to Claude in chat — re-upload the file
// and any new ones merge into your existing database automatically, without
// touching foods you've already added or logged yourself.
const SEED_FOODS = [
  { name: "Lime & coriander microwave rice (250g pack)", calories: 375, protein: 9, carbs: 73, fat: 6 },
  { name: "Lightly smoked salmon, Aldi — raw (225g portion)", calories: 697, protein: 46, carbs: 0, fat: 56 },
  { name: "Alpro vanilla yogurt (250g)", calories: 165, protein: 9.5, carbs: 20, fat: 5.5 },
  { name: "Oats (80g dry)", calories: 303, protein: 10.5, carbs: 54, fat: 5 },
  { name: "3 eggs, scrambled with butter (225g)", calories: 339, protein: 20, carbs: 4, fat: 26 },
  { name: "Peanut butter & olive oil spread on toast, seeded wholemeal (2 slices)", calories: 451, protein: 18, carbs: 38, fat: 27 },
  { name: "Chicken thighs, bone-in \u2192 baked & deboned (~185g cooked)", calories: 345, protein: 46, carbs: 0, fat: 17 },
  { name: "Soy & ginger sticky rice, Tilda (250g pack)", calories: 405, protein: 7, carbs: 78, fat: 6 },
  { name: "Pasta, dry, fusilli/penne (100g)", calories: 371, protein: 13, carbs: 75, fat: 1.5 },
];

function uid() { return Math.random().toString(36).slice(2, 10); }
const VOICE_SUPPORTED = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
function todayStr() { return new Date().toISOString().slice(0, 10); }
function fmtDate(d) {
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Mifflin-St Jeor BMR, scaled by activity, adjusted for goal. Same formula used
// conversationally earlier in this app's development — now available in-app.
function calcTargetsFromStats(weightKg, heightCm, age, sex, activityMultiplier, goal) {
  const bmr = sex === "male"
    ? 10 * weightKg + 6.25 * heightCm - 5 * age + 5
    : 10 * weightKg + 6.25 * heightCm - 5 * age - 161;
  const tdee = bmr * activityMultiplier;
  let calories;
  if (goal === "cut") calories = tdee - 500;
  else if (goal === "bulk") calories = tdee + 300;
  else calories = tdee; // maintain / recomp
  calories = Math.round(calories);
  const protein = Math.round(weightKg * 2.2);
  const fat = Math.round((calories * 0.25) / 9);
  const carbs = Math.max(0, Math.round((calories - protein * 4 - fat * 9) / 4));
  return { calories, protein, carbs, fat };
}

// ---------- Persistence ----------
const STORAGE_KEY = "trainFuelData_v1";
const IS_FRESH_INSTALL = !localStorage.getItem(STORAGE_KEY);
function loadDB() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      return {
        workout: Object.assign({ exercises: [], sessions: [], currentDay: 1, dayLog: [], seededExerciseNames: [] }, parsed.workout || {}),
        nutrition: Object.assign({ foods: [], logs: [], seededFoodNames: [], savedMeals: [], targets: { calories: 2200, protein: 150, carbs: 220, fat: 70 } }, parsed.nutrition || {}),
      };
    }
  } catch (e) { console.error("load failed", e); }
  return {
    // Truly fresh installs start empty — the setup wizard explicitly decides
    // whether to merge in the example exercises/foods via "Load Example Data".
    workout: { exercises: [], sessions: [], currentDay: 1, dayLog: [], seededExerciseNames: [] },
    nutrition: { foods: [], logs: [], seededFoodNames: [], savedMeals: [], targets: { calories: 2200, protein: 150, carbs: 220, fat: 70 } },
  };
}
function saveDB() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
  catch (e) { console.error("save failed", e); }
}

function mergeSeedFoods(db) {
  if (!db.nutrition.seededFoodNames) db.nutrition.seededFoodNames = [];
  const alreadyHandled = new Set(db.nutrition.seededFoodNames.map(n => n.trim().toLowerCase()));
  const existingNames = new Set(db.nutrition.foods.map(f => f.name.trim().toLowerCase()));
  let changed = false;
  SEED_FOODS.forEach(f => {
    const key = f.name.trim().toLowerCase();
    if (alreadyHandled.has(key)) return; // seen before — present or deliberately deleted, either way leave it alone
    if (!existingNames.has(key)) {
      db.nutrition.foods.push({ id: uid(), ...f });
      existingNames.add(key);
    }
    db.nutrition.seededFoodNames.push(f.name);
    alreadyHandled.add(key);
    changed = true;
  });
  return changed;
}

function mergeSeedExercises(db) {
  if (!db.workout.seededExerciseNames) db.workout.seededExerciseNames = [];
  const alreadyHandled = new Set(db.workout.seededExerciseNames.map(n => n.trim().toLowerCase()));
  const existingNames = new Set(db.workout.exercises.map(e => e.name.trim().toLowerCase()));
  let changed = false;
  SEED_EXERCISES.forEach(e => {
    const key = e.name.trim().toLowerCase();
    if (alreadyHandled.has(key)) return; // seen before — present or deliberately deleted, either way leave it alone
    if (!existingNames.has(key)) {
      db.workout.exercises.push({ id: uid(), name: e.name, day: e.day, target: e.target });
      existingNames.add(key);
    }
    db.workout.seededExerciseNames.push(e.name);
    alreadyHandled.add(key);
    changed = true;
  });
  return changed;
}

// Mark every current seed item as "already handled" without adding it — used when
// someone chooses to start with an empty setup, so future code updates (which still
// carry the example exercises/foods for the "Load Example Data" option) never get
// silently merged into a from-scratch setup.
function markAllSeedsHandledWithoutAdding(db) {
  db.workout.seededExerciseNames = SEED_EXERCISES.map(e => e.name);
  db.nutrition.seededFoodNames = SEED_FOODS.map(f => f.name);
}

let DB = loadDB();
if (!IS_FRESH_INSTALL) {
  // Existing user on this device: behave exactly as before, auto-merging any newly
  // added example content. Fresh installs go through the setup wizard instead.
  let seedChanged = false;
  if (mergeSeedFoods(DB)) seedChanged = true;
  if (mergeSeedExercises(DB)) seedChanged = true;
  if (seedChanged) saveDB();
}
let UI = { tab: "train", viewDay: DB.workout.currentDay || 1, modal: null, historyDate: todayStr(), setupStep: IS_FRESH_INSTALL ? "choice" : null };

// ---------- Derived helpers ----------
function todaysSets() { const t = todayStr(); return DB.workout.sessions.filter(s => s.date === t); }
function todaysLogs() { const t = todayStr(); return DB.nutrition.logs.filter(l => l.date === t); }
function todaysTotals() {
  return todaysLogs().reduce((acc, l) => ({
    calories: acc.calories + l.calories, protein: acc.protein + l.protein,
    carbs: acc.carbs + l.carbs, fat: acc.fat + l.fat,
  }), { calories: 0, protein: 0, carbs: 0, fat: 0 });
}
function tonnageToday() {
  return todaysSets().reduce((acc, s) => acc + s.sets.reduce((a, x) => a + x.weight * x.reps, 0), 0);
}
function historyFor(exerciseId) {
  return DB.workout.sessions.filter(s => s.exerciseId === exerciseId).sort((a, b) => a.date < b.date ? -1 : 1);
}

// ---------- Date-based helpers (for History tab) ----------
function setsForDate(date) { return DB.workout.sessions.filter(s => s.date === date); }
function logsForDate(date) { return DB.nutrition.logs.filter(l => l.date === date); }
function totalsForDate(date) {
  return logsForDate(date).reduce((acc, l) => ({
    calories: acc.calories + l.calories, protein: acc.protein + l.protein,
    carbs: acc.carbs + l.carbs, fat: acc.fat + l.fat,
  }), { calories: 0, protein: 0, carbs: 0, fat: 0 });
}
function tonnageForDate(date) {
  return setsForDate(date).reduce((acc, s) => acc + s.sets.reduce((a, x) => a + x.weight * x.reps, 0), 0);
}
function dayLogEntriesForDate(date) { return DB.workout.dayLog.filter(d => d.date === date); }
function allActivityDates() {
  const set = new Set();
  DB.workout.sessions.forEach(s => set.add(s.date));
  DB.nutrition.logs.forEach(l => set.add(l.date));
  return [...set].sort((a, b) => b < a ? -1 : 1); // descending, most recent first
}

// ---------- Render ----------
function render() {
  const scrollPos = window.scrollY;
  const app = document.getElementById("app");
  if (UI.setupStep) {
    app.innerHTML = `<div class="shell">${renderSetupWizard()}</div>`;
    window.scrollTo(0, scrollPos);
    return;
  }
  const pageContent =
    UI.tab === "train" ? renderTrainPage() :
    UI.tab === "food" ? renderFoodPage() :
    UI.tab === "account" ? renderAccountPage() :
    renderHistory();
  app.innerHTML = `
    <div class="shell">
      <div class="top">
        <h1>Train / Fuel</h1>
        <div class="date">${fmtDate(todayStr())}</div>
      </div>
      ${pageContent}
    </div>
    <div class="tabbar">
      <div class="tabbar-inner">
        <button class="tab-btn ${UI.tab === "train" ? "active" : ""}" data-action="tab" data-tab="train">Train</button>
        <button class="tab-btn ${UI.tab === "food" ? "active fuel-active" : ""}" data-action="tab" data-tab="food">Food</button>
        <button class="tab-btn ${UI.tab === "account" ? "active" : ""}" data-action="tab" data-tab="account">Account</button>
        <button class="tab-btn ${UI.tab === "history" ? "active fuel-active" : ""}" data-action="tab" data-tab="history">History</button>
      </div>
    </div>
    ${renderModal()}
  `;
  window.scrollTo(0, scrollPos);
}

function macroGauges(totals, targets) {
  const rows = [
    { key: "calories", label: "Calories", color: "#2A3A5A", unit: "" },
    { key: "protein", label: "Protein", color: "#4F6B3A", unit: "g" },
    { key: "carbs", label: "Carbs", color: "#3A5A7A", unit: "g" },
    { key: "fat", label: "Fat", color: "#B31E23", unit: "g" },
  ];
  return rows.map(r => {
    const val = Math.round(totals[r.key]);
    const target = targets[r.key] || 1;
    const pct = Math.min(100, (val / target) * 100);
    return `
      <div class="gauge-row">
        <div class="gauge-head"><span>${r.label}</span><span class="val">${val}${r.unit} / ${target}${r.unit}</span></div>
        <div class="gauge-track"><div class="gauge-fill" style="width:${pct}%;background:${r.color}"></div></div>
      </div>`;
  }).join("");
}

function renderSetupWizard() {
  if (UI.setupStep === "choice") {
    return `
      <div class="top"><h1>Train / Fuel</h1></div>
      <div class="card">
        <h2>Welcome</h2>
        <div style="font-size:14px;margin-bottom:16px;line-height:1.5;">
          Set up your own training days, foods, and targets — or start from a filled-in example to see how it works, then edit freely.
        </div>
        <button class="action" style="width:100%;justify-content:center;margin-bottom:10px;padding:14px;" data-action="chooseFreshStart">Start With My Own Setup</button>
        <button class="action ghost" style="width:100%;justify-content:center;padding:14px;" data-action="chooseExampleData">Load Example Data First</button>
        <div style="font-size:11px;color:var(--text-dim);margin-top:10px;">Example data can be edited or removed at any time afterward — nothing is locked in.</div>
      </div>`;
  }
  if (UI.setupStep === "targets") {
    const f = UI.setupForm || {};
    const result = UI.setupTargetsResult;
    return `
      <div class="top"><h1>Train / Fuel</h1></div>
      <div class="card">
        <h2>Set Your Daily Targets</h2>
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:14px;">
          Optional — calculate a starting point from your stats, or skip and set numbers manually later via Edit Targets.
        </div>
        <div class="row">
          <label class="field">Weight (kg)<input id="su-weight" type="number" value="${f.weight || ""}" /></label>
          <label class="field">Height (cm)<input id="su-height" type="number" value="${f.height || ""}" /></label>
        </div>
        <div class="row">
          <label class="field">Age<input id="su-age" type="number" value="${f.age || ""}" /></label>
          <label class="field">Sex
            <select id="su-sex">
              <option value="male" ${f.sex === "male" ? "selected" : ""}>Male</option>
              <option value="female" ${f.sex === "female" ? "selected" : ""}>Female</option>
            </select>
          </label>
        </div>
        <label class="field">Activity level
          <select id="su-activity">
            <option value="1.375" ${f.activity === "1.375" ? "selected" : ""}>Light (1-2 sessions/week)</option>
            <option value="1.55" ${!f.activity || f.activity === "1.55" ? "selected" : ""}>Moderate (3-5 sessions/week)</option>
            <option value="1.725" ${f.activity === "1.725" ? "selected" : ""}>High (6+ sessions/week)</option>
          </select>
        </label>
        <label class="field">Goal
          <select id="su-goal">
            <option value="cut" ${f.goal === "cut" ? "selected" : ""}>Fat loss</option>
            <option value="maintain" ${!f.goal || f.goal === "maintain" ? "selected" : ""}>Maintain / recomp</option>
            <option value="bulk" ${f.goal === "bulk" ? "selected" : ""}>Build muscle</option>
          </select>
        </label>
        <button class="action fuel" style="width:100%;justify-content:center;margin-top:8px;" data-action="calcSetupTargets">Calculate</button>
        ${result ? `
          <div class="card" style="margin-top:14px;background:var(--surface-alt);">
            <div class="mono" style="font-size:13px;line-height:1.8;">
              Calories: ${result.calories}<br/>
              Protein: ${result.protein}g<br/>
              Carbs: ${result.carbs}g<br/>
              Fat: ${result.fat}g
            </div>
          </div>
          <button class="action" style="width:100%;justify-content:center;margin-top:10px;padding:14px;" data-action="useCalculatedTargets">Use These Targets</button>
        ` : ""}
        <button class="action ghost" style="width:100%;justify-content:center;margin-top:10px;padding:14px;" data-action="skipTargetsSetup">Skip — I'll set targets manually later</button>
      </div>`;
  }
  return "";
}

function renderTrainPage() {
  const viewDay = UI.viewDay;
  const dayExercises = DB.workout.exercises.filter(e => e.day === viewDay);
  const isNextDay = viewDay === DB.workout.currentDay;
  const lastDayDone = [...DB.workout.dayLog].reverse().find(d => d.day === viewDay);

  const dayButtons = DAYS.map(d => `
    <button class="action ghost day-btn" data-action="setViewDay" data-day="${d.day}"
      style="border-color:${viewDay === d.day ? DAY_COLOR[d.day] : 'var(--border)'};color:${viewDay === d.day ? DAY_COLOR[d.day] : 'var(--text-dim)'};">
      Day ${d.day}<span class="muscle">${d.muscle}</span>
      ${DB.workout.currentDay === d.day ? '<span class="day-dot"></span>' : ""}
    </button>`).join("");

  const today = todayStr();
  const exerciseRows = dayExercises.map(ex => {
    const hist = historyFor(ex.id); // ascending by date
    const priorSessions = hist.filter(s => s.date !== today);
    const todaySessions = hist.filter(s => s.date === today);
    const target = priorSessions[priorSessions.length - 1]; // most recent non-today session
    const todayEntry = todaySessions[todaySessions.length - 1]; // latest of today's logs, if any

    let historyBlock;
    if (!target && !todayEntry) {
      historyBlock = `<div style="font-size:11px;color:var(--text-dim);margin-top:4px;">No history yet — this'll set the baseline.</div>`;
    } else {
      historyBlock = `<div style="margin-top:8px;">`;
      if (target) {
        historyBlock += `
          <div style="font-size:11px;color:var(--text-dim);margin-bottom:4px;">Target — ${fmtDate(target.date)}</div>
          <div class="plate-strip plate-strip-target">${target.sets.map(s => `<div class="plate plate-target"><div class="w">${s.weight}</div><div class="r">×${s.reps}</div></div>`).join("")}</div>`;
      }
      if (todayEntry) {
        historyBlock += `
          <div style="font-size:11px;color:var(--accent);margin:${target ? "10px" : "0"} 0 4px;">● Today</div>
          <div class="plate-strip">${todayEntry.sets.map(s => `<div class="plate"><div class="w">${s.weight}</div><div class="r">×${s.reps}</div></div>`).join("")}</div>
          ${todayEntry.note ? `<div class="note-box">"${escapeHtml(todayEntry.note)}"</div>` : ""}`;
      } else if (target) {
        historyBlock += `<div style="font-size:11px;color:var(--text-dim);margin-top:8px;">Not logged today yet — match or beat the target above.</div>`;
      }
      historyBlock += `</div>`;
    }

    return `
      <div style="border-bottom:1px solid var(--border);padding:10px 0;">
        <div class="list-item" style="border-bottom:none;padding:0;">
          <div>
            <div style="font-weight:600;">${escapeHtml(ex.name)}</div>
            ${ex.target ? `<span class="mono" style="font-size:11px;color:var(--text-dim);">target ${escapeHtml(ex.target)}</span>` : ""}
          </div>
          <button class="action" style="font-size:11px;padding:6px 10px;background:${DAY_COLOR[ex.day]};" data-action="openLogSets" data-id="${ex.id}">+ Log</button>
        </div>
        ${historyBlock}
      </div>`;
  }).join("");

  return `
    <div class="card card-journal">
      <h2>Training</h2>
      <div class="row" style="margin-bottom:12px;gap:6px;">${dayButtons}</div>
      ${isNextDay
        ? `<div class="mono" style="font-size:11px;color:var(--accent);margin-bottom:10px;">● This is your next day up</div>`
        : `<div class="mono" style="font-size:11px;color:var(--text-dim);margin-bottom:10px;">Viewing Day ${viewDay} — next up is Day ${DB.workout.currentDay}</div>`}
      ${lastDayDone ? `<div style="font-size:11px;color:var(--text-dim);margin-bottom:10px;">Last done: ${fmtDate(lastDayDone.date)}</div>` : ""}
      ${dayExercises.length === 0 ? `<div class="empty">No exercises on this day yet. Add some from the Account tab.</div>` : exerciseRows}
    </div>
    ${dayExercises.length > 0 ? `<button class="action" style="width:100%;justify-content:center;padding:13px 14px;margin-bottom:14px;" data-action="markDayComplete">Mark Day ${viewDay} Complete → Next: Day ${viewDay === 4 ? 1 : viewDay + 1}</button>` : ""}
  `;
}

function renderFoodPage() {
  const logs = todaysLogs(), totals = todaysTotals();
  const logRows = logs.map(l => `
    <div style="border-bottom:1px solid var(--paper-line);padding:10px 0;">
      <div class="list-item" style="border-bottom:none;padding:0;">
        <div>
          <div style="font-weight:600;">${escapeHtml(l.foodName)}</div>
          <div class="mono" style="font-size:11px;color:var(--text-dim);">${l.servings}× · ${l.calories} kcal · P${l.protein} C${l.carbs} F${l.fat}</div>
        </div>
        <button class="icon-btn" data-action="deleteLog" data-id="${l.id}">✕</button>
      </div>
      ${l.note ? `<div class="note-box">"${escapeHtml(l.note)}"</div>` : ""}
    </div>`).join("");

  const savedMeals = DB.nutrition.savedMeals || [];
  const savedMealRows = savedMeals.map(meal => {
    const items = meal.items
      .map(it => DB.nutrition.foods.find(f => f.id === it.foodId))
      .filter(Boolean);
    const totalCal = meal.items.reduce((sum, it) => {
      const f = DB.nutrition.foods.find(x => x.id === it.foodId);
      return sum + (f ? Math.round(f.calories * it.servings) : 0);
    }, 0);
    return `
      <div class="list-item">
        <button style="flex:1;text-align:left;background:none;border:none;color:var(--text);cursor:pointer;padding:0;" data-action="quickLogSavedMeal" data-id="${meal.id}">
          <div style="font-weight:600;">🍽️ ${escapeHtml(meal.name)}</div>
          <div class="mono" style="font-size:11px;color:var(--text-dim);">${items.length} item${items.length === 1 ? "" : "s"} · ~${totalCal} kcal · tap to log</div>
        </button>
        <button class="icon-btn" data-action="deleteSavedMeal" data-id="${meal.id}">✕</button>
      </div>`;
  }).join("");

  return `
    <div class="card">
      <h2>Today's Fuel</h2>
      ${macroGauges(totals, DB.nutrition.targets)}
    </div>
    ${savedMeals.length > 0 ? `
    <div class="card">
      <h2>Saved Meals</h2>
      ${savedMealRows}
    </div>` : ""}
    <div class="card card-journal">
      <h2>Today's Log</h2>
      ${logs.length === 0 ? `<div class="empty">Nothing logged yet — add what you've eaten below.</div>` : logRows}
      <button class="action fuel" style="margin-top:12px;" data-action="openLogMeal">+ Log a Meal</button>
    </div>
  `;
}

function renderHistory() {
  const date = UI.historyDate || todayStr();
  const dayLogs = dayLogEntriesForDate(date);
  const sets = setsForDate(date);
  const logs = logsForDate(date);
  const totals = totalsForDate(date);
  const dates = allActivityDates();

  const trainingBlock = dayLogs.length === 0 && sets.length === 0
    ? `<div class="empty">No training logged this day.</div>`
    : `
      ${dayLogs.map(d => `<div style="font-size:12px;color:var(--accent);margin-bottom:8px;">✓ Day ${d.day} — ${dayMuscle(d.day)} marked complete</div>`).join("")}
      ${sets.map(s => `
        <div style="border-bottom:1px solid var(--paper-line);padding:8px 0;">
          <div style="font-weight:600;font-size:13px;">${escapeHtml(s.exerciseName)}</div>
          <div class="plate-strip" style="margin-top:6px;">${s.sets.map(x => `<div class="plate"><div class="w">${x.weight}</div><div class="r">×${x.reps}</div></div>`).join("")}</div>
          ${s.note ? `<div class="note-box">"${escapeHtml(s.note)}"</div>` : ""}
        </div>`).join("")}
    `;

  const foodBlock = logs.length === 0
    ? `<div class="empty">No food logged this day.</div>`
    : logs.map(l => `
        <div style="border-bottom:1px solid var(--paper-line);padding:8px 0;">
          <div class="list-item" style="border-bottom:none;padding:0;">
            <div>
              <div style="font-weight:600;">${escapeHtml(l.foodName)}</div>
              <div class="mono" style="font-size:11px;color:var(--text-dim);">${l.servings}× · ${l.calories} kcal · P${l.protein} C${l.carbs} F${l.fat}</div>
            </div>
            <button class="icon-btn" data-action="deleteLog" data-id="${l.id}">✕</button>
          </div>
          ${l.note ? `<div class="note-box">"${escapeHtml(l.note)}"</div>` : ""}
        </div>`).join("");

  const quickDates = dates.slice(0, 10).map(d => `
    <button class="action ghost" style="font-size:11px;padding:6px 10px;flex:0 0 auto;border-color:${d === date ? 'var(--fuel)' : 'var(--border)'};color:${d === date ? 'var(--fuel)' : 'var(--text-dim)'};" data-action="setHistoryDate" data-date="${d}">${fmtDate(d)}</button>
  `).join("");

  return `
    <div class="card">
      <h2>Browse a Day</h2>
      <label class="field">Pick a date<input type="date" id="history-date-input" value="${date}" max="${todayStr()}" /></label>
      ${dates.length > 0 ? `<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;">${quickDates}</div>` : ""}
    </div>
    <div class="card card-journal">
      <h2>Training — ${fmtDate(date)}</h2>
      ${trainingBlock}
    </div>
    <div class="card card-journal">
      <h2>Fuel — ${fmtDate(date)}</h2>
      ${macroGauges(totals, DB.nutrition.targets)}
      <div style="margin-top:12px;">${foodBlock}</div>
    </div>
  `;
}

          ${m.voiceTranscript ? `<div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">Heard: "${escapeHtml(m.voiceTranscript)}"</div>` : ""}
          ${m.voiceUnmatched && m.voiceUnmatched.length > 0 ? `<div style="font-size:12px;color:var(--danger);margin-bottom:10px;">Couldn't match: ${m.voiceUnmatched.map(escapeHtml).join(", ")} — add these manually below if needed.</div>` : ""}
          ${m.voiceError ? `<div style="font-size:12px;color:var(--danger);margin-bottom:10px;">${escapeHtml(m.voiceError)}</div>` : ""}
          ${foods.length === 0 ? `<div class="empty">No foods match. Add foods to your database first.</div>` : rows}
          <div class="row" style="margin-top:10px;">
            <button class="action fuel" data-action="saveLogMeal" ${anyChecked ? "" : "disabled"}>Log Meal</button>
            <button class="action ghost" data-action="saveAsMeal" ${anyChecked ? "" : "disabled"}>💾 Save as Meal</button>
          </div>
        </div>
      </div>`;
  }
  if (m.type === "bulkAddFoods") {
    return `
      <div class="modal-backdrop" data-action="closeModal">
        <div class="modal fuel-modal">
          <div class="modal-head"><h3>Paste Multiple Foods</h3><button class="icon-btn" data-action="closeModal">✕</button></div>
          <div style="font-size:12px;color:var(--text-dim);margin-bottom:10px;">
            One food per line: <span class="mono">Name, calories, protein, carbs, fat</span> — values per 100g (or your usual serving).
          </div>
          <label class="field">Paste here
            <textarea id="bulk-text" rows="8" style="width:100%;background:var(--surface-alt);border:1px solid var(--border);color:var(--text);border-radius:3px;padding:8px 10px;font-family:'JetBrains Mono',monospace;font-size:12px;" placeholder="Chicken breast (per 100g), 165, 31, 0, 3.6
Microwave rice (per 100g), 130, 2.7, 28, 0.3">${escapeHtml(m.text || "")}</textarea>
          </label>
          <div id="bulk-status" class="mono" style="font-size:11px;color:var(--danger);margin-bottom:8px;">${m.status ? escapeHtml(m.status) : ""}</div>
          <button class="action fuel" data-action="saveBulkAdd">Add All</button>
        </div>
      </div>`;
  }
  if (m.type === "searchFood") {
    const results = m.results || [];
    const resultRows = results.map((r, i) => `
      <div class="list-item">
        <div>
          <div style="font-weight:600;font-size:13px;">${escapeHtml(r.name)}</div>
          ${r.brand ? `<div style="font-size:11px;color:var(--text-dim);">${escapeHtml(r.brand)}</div>` : ""}
          <div class="mono" style="font-size:11px;color:var(--text-dim);">${r.calories} kcal · P${r.protein} C${r.carbs} F${r.fat} <span style="opacity:0.7;">/100g</span></div>
        </div>
        <button class="action fuel" style="font-size:11px;padding:6px 10px;" data-action="addSearchResult" data-idx="${i}">+ Add</button>
      </div>`).join("");
    return `
      <div class="modal-backdrop" data-action="closeModal">
        <div class="modal fuel-modal">
          <div class="modal-head"><h3>Search Food Online</h3><button class="icon-btn" data-action="closeModal">✕</button></div>
          <div class="row" style="margin-bottom:10px;">
            <input id="search-food-input" placeholder="e.g. Aldi smoked salmon" value="${escapeHtml(m.query || "")}" />
            <button class="action fuel" style="flex:0 0 auto;" data-action="runFoodSearch">Search</button>
          </div>
          <div style="font-size:11px;color:var(--text-dim);margin-bottom:10px;">
            Searches Open Food Facts — a free, open database of packaged/branded foods. Works best for supermarket products, not homemade meals.
          </div>
          ${m.loading ? `<div class="empty">Searching…</div>` : ""}
          ${m.error ? `<div class="empty" style="color:var(--danger);">${escapeHtml(m.error)}</div>` : ""}
          ${!m.loading && !m.error && m.searched && results.length === 0 ? `<div class="empty">No results with full nutrition data. Try a simpler search term, or add it manually.</div>` : ""}
          ${resultRows}
        </div>
      </div>`;
  }
  return "";
}

// ---------- Actions ----------
function handleAction(action, el) {
  switch (action) {
    case "chooseFreshStart":
      markAllSeedsHandledWithoutAdding(DB);
      UI.setupStep = "targets";
      break;
    case "chooseExampleData": {
      let seedChanged = false;
      if (mergeSeedFoods(DB)) seedChanged = true;
      if (mergeSeedExercises(DB)) seedChanged = true;
      UI.viewDay = DB.workout.currentDay;
      UI.setupStep = "targets";
      break;
    }
    case "calcSetupTargets": {
      const weight = Number(document.getElementById("su-weight").value);
      const height = Number(document.getElementById("su-height").value);
      const age = Number(document.getElementById("su-age").value);
      const sex = document.getElementById("su-sex").value;
      const activity = document.getElementById("su-activity").value;
      const goal = document.getElementById("su-goal").value;
      UI.setupForm = { weight, height, age, sex, activity, goal };
      if (weight > 0 && height > 0 && age > 0) {
        UI.setupTargetsResult = calcTargetsFromStats(weight, height, age, sex, Number(activity), goal);
      }
      break;
    }
    case "useCalculatedTargets":
      DB.nutrition.targets = UI.setupTargetsResult;
      saveDB();
      UI.setupStep = null;
      break;
    case "skipTargetsSetup":
      saveDB();
      UI.setupStep = null;
      break;
    case "tab":
      UI.tab = el.dataset.tab;
      if (UI.tab === "train") UI.viewDay = DB.workout.currentDay;
      if (UI.tab === "history" && !UI.historyDate) UI.historyDate = todayStr();
      break;
    case "setViewDay":
      UI.viewDay = Number(el.dataset.day);
      break;
    case "setHistoryDate":
      UI.historyDate = el.dataset.date;
      break;
    case "openAddExercise":
      UI.modal = { type: "addExercise", day: UI.viewDay };
      break;
    case "openEditExercise": {
      const ex = DB.workout.exercises.find(e => e.id === el.dataset.id);
      if (!ex) break;
      UI.modal = { type: "addExercise", editId: ex.id, name: ex.name, day: ex.day, target: ex.target };
      break;
    }
    case "saveAddExercise": {
      const name = document.getElementById("f-name").value.trim();
      const day = Number(document.getElementById("f-day").value);
      const target = document.getElementById("f-target").value.trim();
      if (!name) break;
      if (UI.modal.editId) {
        const ex = DB.workout.exercises.find(e => e.id === UI.modal.editId);
        if (ex) { ex.name = name; ex.day = day; ex.target = target; }
      } else {
        DB.workout.exercises.push({ id: uid(), name, day, target });
      }
      saveDB();
      UI.modal = null;
      break;
    }
    case "deleteExercise": {
      const ex = DB.workout.exercises.find(e => e.id === el.dataset.id);
      if (!ex || !confirm(`Remove "${ex.name}" from your training? Past logged sets stay in History, but you won't be able to log new sets against it unless you re-add it.`)) return;
      DB.workout.exercises = DB.workout.exercises.filter(e => e.id !== el.dataset.id);
      saveDB();
      break;
    }
    case "openLogSets":
      UI.modal = { type: "logSets", exerciseId: el.dataset.id, sets: [{ weight: "", reps: "" }] };
      break;
    case "addSetRow":
      UI.modal.sets.push({ weight: UI.modal.sets[UI.modal.sets.length - 1]?.weight || "", reps: "" });
      break;
    case "removeSetRow":
      UI.modal.sets.splice(Number(el.dataset.idx), 1);
      break;
    case "saveLogSets": {
      const ex = DB.workout.exercises.find(e => e.id === UI.modal.exerciseId);
      const sets = UI.modal.sets.map(s => ({ weight: Number(s.weight) || 0, reps: Number(s.reps) || 0 }));
      const note = (document.getElementById("f-note")?.value || "").trim();
      DB.workout.sessions.push({ id: uid(), date: todayStr(), exerciseId: ex.id, exerciseName: ex.name, sets, note });
      saveDB();
      UI.modal = null;
      break;
    }
    case "markDayComplete": {
      const day = UI.viewDay;
      const nextDay = day === 4 ? 1 : day + 1;
      DB.workout.dayLog.push({ day, date: todayStr() });
      DB.workout.currentDay = nextDay;
      saveDB();
      UI.viewDay = nextDay;
      break;
    }
    case "openAddFood":
      UI.modal = { type: "addFood" };
      break;
    case "openEditFood": {
      const f = DB.nutrition.foods.find(x => x.id === el.dataset.id);
      if (!f) break;
      UI.modal = { type: "addFood", editId: f.id, name: f.name, calories: f.calories, protein: f.protein, carbs: f.carbs, fat: f.fat };
      break;
    }
    case "saveAddFood": {
      const name = document.getElementById("f-name").value.trim();
      const calories = Number(document.getElementById("f-cal").value) || 0;
      const protein = Number(document.getElementById("f-pro").value) || 0;
      const carbs = Number(document.getElementById("f-carb").value) || 0;
      const fat = Number(document.getElementById("f-fat").value) || 0;
      if (!name) break;
      if (UI.modal.editId) {
        const f = DB.nutrition.foods.find(x => x.id === UI.modal.editId);
        if (f) { f.name = name; f.calories = calories; f.protein = protein; f.carbs = carbs; f.fat = fat; }
      } else {
        DB.nutrition.foods.push({ id: uid(), name, calories, protein, carbs, fat });
      }
      saveDB();
      UI.modal = null;
      break;
    }
    case "deleteFood": {
      const f = DB.nutrition.foods.find(x => x.id === el.dataset.id);
      if (!f || !confirm(`Remove "${f.name}" from your food database? Past logged entries stay in History, but you'll need to re-add it to log it again.`)) return;
      DB.nutrition.foods = DB.nutrition.foods.filter(x => x.id !== el.dataset.id);
      saveDB();
      break;
    }
    case "openLogFood":
      UI.modal = { type: "logFood", foodId: el.dataset.id, servings: "1" };
      break;
    case "saveLogFood": {
      const f = DB.nutrition.foods.find(x => x.id === UI.modal.foodId);
      const servings = Number(UI.modal.servings) || 0;
      const note = (document.getElementById("f-note")?.value || "").trim();
      if (servings > 0) {
        DB.nutrition.logs.push({
          id: uid(), date: todayStr(), foodId: f.id, foodName: f.name, servings,
          calories: Math.round(f.calories * servings), protein: Math.round(f.protein * servings),
          carbs: Math.round(f.carbs * servings), fat: Math.round(f.fat * servings), note,
        });
        saveDB();
        UI.modal = null;
      }
      break;
    }
    case "deleteLog":
      DB.nutrition.logs = DB.nutrition.logs.filter(l => l.id !== el.dataset.id);
      saveDB();
      break;
    case "openTargets":
      UI.modal = { type: "targets", targets: { ...DB.nutrition.targets } };
      break;
    case "saveTargets": {
      DB.nutrition.targets = {
        calories: Number(document.getElementById("t-cal").value) || 0,
        protein: Number(document.getElementById("t-pro").value) || 0,
        carbs: Number(document.getElementById("t-carb").value) || 0,
        fat: Number(document.getElementById("t-fat").value) || 0,
      };
      saveDB();
      UI.modal = null;
      break;
    }
    case "openLogMeal":
      UI.modal = { type: "logMeal", query: "", picks: {}, listening: false, voiceTranscript: "", voiceUnmatched: [], voiceError: "" };
      break;
    case "saveLogMeal": {
      const date = todayStr();
      Object.entries(UI.modal.picks).forEach(([foodId, servingsRaw]) => {
        const servings = Number(servingsRaw) || 0;
        if (servings <= 0) return;
        const f = DB.nutrition.foods.find(x => x.id === foodId);
        if (!f) return;
        DB.nutrition.logs.push({
          id: uid(), date, foodId: f.id, foodName: f.name, servings,
          calories: Math.round(f.calories * servings), protein: Math.round(f.protein * servings),
          carbs: Math.round(f.carbs * servings), fat: Math.round(f.fat * servings),
        });
      });
      saveDB();
      UI.modal = null;
      break;
    }
    case "saveAsMeal": {
      const items = Object.entries(UI.modal.picks)
        .filter(([, v]) => Number(v) > 0)
        .map(([foodId, v]) => ({ foodId, servings: Number(v) }));
      if (items.length === 0) return;
      const name = prompt("Name this meal (e.g. Usual Breakfast):");
      if (!name || !name.trim()) return;
      if (!DB.nutrition.savedMeals) DB.nutrition.savedMeals = [];
      DB.nutrition.savedMeals.push({ id: uid(), name: name.trim(), items });
      saveDB();
      break;
    }
    case "quickLogSavedMeal": {
      const meal = DB.nutrition.savedMeals.find(m => m.id === el.dataset.id);
      if (!meal) break;
      const date = todayStr();
      meal.items.forEach(item => {
        const f = DB.nutrition.foods.find(x => x.id === item.foodId);
        if (!f) return; // food may have been deleted since this meal was saved
        DB.nutrition.logs.push({
          id: uid(), date, foodId: f.id, foodName: f.name, servings: item.servings,
          calories: Math.round(f.calories * item.servings), protein: Math.round(f.protein * item.servings),
          carbs: Math.round(f.carbs * item.servings), fat: Math.round(f.fat * item.servings),
        });
      });
      saveDB();
      break;
    }
    case "deleteSavedMeal": {
      const meal = DB.nutrition.savedMeals.find(m => m.id === el.dataset.id);
      if (!meal || !confirm(`Remove saved meal "${meal.name}"? This won't affect anything already logged.`)) return;
      DB.nutrition.savedMeals = DB.nutrition.savedMeals.filter(m => m.id !== el.dataset.id);
      saveDB();
      break;
    }
    case "openBulkAdd":
      UI.modal = { type: "bulkAddFoods" };
      break;
    case "saveBulkAdd": {
      const text = document.getElementById("bulk-text").value;
      const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
      let added = 0, failed = [];
      lines.forEach(line => {
        const parts = line.split(",").map(p => p.trim());
        if (parts.length < 5) { failed.push(line); return; }
        const [name, cal, pro, carb, fat] = parts;
        if (!name || isNaN(Number(cal))) { failed.push(line); return; }
        DB.nutrition.foods.push({
          id: uid(), name, calories: Number(cal) || 0, protein: Number(pro) || 0,
          carbs: Number(carb) || 0, fat: Number(fat) || 0,
        });
        added++;
      });
      if (added > 0) saveDB();
      if (failed.length > 0) {
        UI.modal = { type: "bulkAddFoods", status: `Added ${added}. Couldn't parse ${failed.length} line(s) — check the format.`, text };
      } else {
        UI.modal = null;
      }
      break;
    }
    case "openSearchFood":
      UI.modal = { type: "searchFood", query: "", results: [], loading: false, searched: false };
      break;
    case "openSearchFoodFromDb":
      UI.modal = { type: "searchFood", query: UI.foodDbQuery || "", results: [], loading: false, searched: false };
      break;
    case "addSearchResult": {
      const r = UI.modal.results[Number(el.dataset.idx)];
      if (r) {
        DB.nutrition.foods.push({ id: uid(), name: r.brand ? `${r.name} (${r.brand})` : r.name, calories: r.calories, protein: r.protein, carbs: r.carbs, fat: r.fat });
        saveDB();
      }
      break;
    }
    case "exportBackup": {
      const payload = { workout: DB.workout, nutrition: DB.nutrition, exportedAt: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `train-fuel-backup-${todayStr()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      const status = document.getElementById("backup-status");
      if (status) status.textContent = "Backup downloaded.";
      break;
    }
    case "triggerImport":
      document.getElementById("import-file-input").click();
      return; // no render needed, handled by file input change listener
    case "closeModal":
      UI.modal = null;
      break;
  }
  render();
  attachFieldListeners();
  if (action === "tab") window.scrollTo(0, 0);
}

function attachFieldListeners() {
  // Live-update fields inside modals that need to reflect into UI.modal state
  const setFieldEls = document.querySelectorAll('[data-action="setField"]');
  setFieldEls.forEach(elm => {
    elm.oninput = () => {
      const idx = Number(elm.dataset.idx), field = elm.dataset.field;
      UI.modal.sets[idx][field] = elm.value;
    };
  });
  const noteEl = document.getElementById("f-note");
  if (noteEl) {
    noteEl.oninput = () => { UI.modal.note = noteEl.value; };
  }
  const servingsEl = document.querySelector('[data-action="updateServings"]');
  if (servingsEl) {
    servingsEl.oninput = () => {
      UI.modal.servings = servingsEl.value;
      render();
      attachFieldListeners();
      const el2 = document.getElementById("f-servings");
      if (el2) el2.focus(); // no selectionStart/End here — number inputs throw on that in some browsers
    };
  }
  const mealSearchEl = document.querySelector('[data-action="mealSearch"]');
  if (mealSearchEl) {
    mealSearchEl.oninput = () => {
      UI.modal.query = mealSearchEl.value;
      render();
      attachFieldListeners();
      const el2 = document.getElementById("meal-search");
      if (el2) { el2.focus(); el2.selectionStart = el2.selectionEnd = el2.value.length; }
    };
  }
  document.querySelectorAll('[data-action="mealPick"]').forEach(elm => {
    elm.oninput = () => {
      UI.modal.picks[elm.dataset.id] = elm.value;
      const hasAny = Object.values(UI.modal.picks).some(v => Number(v) > 0);
      const btn = document.querySelector('[data-action="saveLogMeal"]');
      if (btn) btn.disabled = !hasAny;
      const saveBtn = document.querySelector('[data-action="saveAsMeal"]');
      if (saveBtn) saveBtn.disabled = !hasAny;
    };
  });
  const foodDbSearchInput = document.getElementById("food-db-search");
  if (foodDbSearchInput) {
    foodDbSearchInput.oninput = () => {
      UI.foodDbQuery = foodDbSearchInput.value;
      render();
      attachFieldListeners();
      const el2 = document.getElementById("food-db-search");
      if (el2) { el2.focus(); el2.selectionStart = el2.selectionEnd = el2.value.length; }
    };
  }
  const historyDateInput = document.getElementById("history-date-input");
  if (historyDateInput) {
    historyDateInput.onchange = () => {
      UI.historyDate = historyDateInput.value;
      render();
      attachFieldListeners();
    };
  }
  const searchInput = document.getElementById("search-food-input");
  if (searchInput) {
    searchInput.oninput = () => { UI.modal.query = searchInput.value; };
    searchInput.onkeydown = (e) => { if (e.key === "Enter") runFoodSearch(); };
  }
  const importInput = document.getElementById("import-file-input");
  if (importInput) {
    importInput.onchange = (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const status = document.getElementById("backup-status");
        try {
          const parsed = JSON.parse(reader.result);
          if (parsed.workout) DB.workout = Object.assign({ exercises: [], sessions: [], currentDay: 1, dayLog: [], seededExerciseNames: [] }, parsed.workout);
          if (parsed.nutrition) DB.nutrition = Object.assign({ foods: [], logs: [], seededFoodNames: [], savedMeals: [], targets: { calories: 2200, protein: 150, carbs: 220, fat: 70 } }, parsed.nutrition);
          saveDB();
          UI.viewDay = DB.workout.currentDay;
          render();
          attachFieldListeners();
          const s = document.getElementById("backup-status");
          if (s) s.textContent = "Restored from backup.";
        } catch (err) {
          if (status) status.textContent = "Couldn't read that file — make sure it's a backup exported from this app.";
        }
      };
      reader.readAsText(file);
    };
  }
}

document.addEventListener("click", (e) => {
  // Never let a click that lands on a form field trigger delegation — including
  // walking up to an ancestor's data-action (e.g. a modal backdrop's close action).
  // Form fields are wired via their own oninput/onkeydown/onchange listeners.
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;

  // Close modal only when the backdrop itself is clicked directly (not a child of it)
  if (e.target.classList && e.target.classList.contains("modal-backdrop")) {
    UI.modal = null;
    render();
    attachFieldListeners();
    return;
  }
  const el = e.target.closest("[data-action]");
  if (!el) return;
  if (el.dataset.action === "runFoodSearch") {
    runFoodSearch();
    return;
  }
  if (el.dataset.action === "openSearchFoodFromDb") {
    handleAction(el.dataset.action, el);
    runFoodSearch();
    return;
  }
  if (el.dataset.action === "startVoiceLog") {
    startVoiceLog();
    return;
  }
  handleAction(el.dataset.action, el);
});

function matchFoodSegment(segment) {
  const words = segment.toLowerCase().replace(/[^a-z0-9\s]/g, "").split(/\s+/).filter(w => w.length > 2);
  let best = null, bestScore = 0;
  DB.nutrition.foods.forEach(f => {
    const fname = f.name.toLowerCase();
    let score = 0;
    words.forEach(w => { if (fname.includes(w)) score++; });
    if (score > bestScore) { bestScore = score; best = f; }
  });
  return bestScore > 0 ? best : null;
}

function extractLeadingNumber(segment) {
  const match = segment.match(/(\d+(\.\d+)?)/);
  return match ? parseFloat(match[1]) : null;
}

function parseVoiceTranscript(transcript) {
  const segments = transcript.split(/,|\band\b|\bwith\b|\bplus\b/i).map(s => s.trim()).filter(Boolean);
  const matched = [];
  const unmatched = [];
  segments.forEach(seg => {
    const food = matchFoodSegment(seg);
    if (food) {
      const num = extractLeadingNumber(seg);
      matched.push({ foodId: food.id, servings: num || 1 });
    } else {
      unmatched.push(seg);
    }
  });
  return { matched, unmatched };
}

function startVoiceLog() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    UI.modal.voiceError = "Voice input isn't supported in this browser. On iPhone, tap the microphone icon on your keyboard instead while typing in the search box above.";
    render();
    attachFieldListeners();
    return;
  }
  const recognition = new SR();
  recognition.lang = "en-GB";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  UI.modal.listening = true;
  UI.modal.voiceError = "";
  render();
  attachFieldListeners();

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    const { matched, unmatched } = parseVoiceTranscript(transcript);
    matched.forEach(m => { UI.modal.picks[m.foodId] = String(m.servings); });
    UI.modal.voiceTranscript = transcript;
    UI.modal.voiceUnmatched = unmatched;
    UI.modal.voiceMatchedIds = matched.map(m => m.foodId);
    UI.modal.listening = false;
    render();
    attachFieldListeners();
  };
  recognition.onerror = () => {
    UI.modal.listening = false;
    UI.modal.voiceError = "Didn't catch that — try again.";
    render();
    attachFieldListeners();
  };
  recognition.onend = () => {
    if (UI.modal && UI.modal.listening) {
      UI.modal.listening = false;
      render();
      attachFieldListeners();
    }
  };
  recognition.start();
}

async function runFoodSearch() {
  const input = document.getElementById("search-food-input");
  const query = input ? input.value.trim() : (UI.modal.query || "");
  if (!query) return;
  UI.modal = { type: "searchFood", query, results: [], loading: true, searched: false };
  render();
  attachFieldListeners();
  try {
    const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&json=1&page_size=10&fields=product_name,brands,nutriments`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("Network response was not ok");
    const data = await res.json();
    const products = (data.products || []);
    const results = products
      .filter(p => p.product_name && p.nutriments && p.nutriments["energy-kcal_100g"] != null)
      .map(p => ({
        name: p.product_name,
        brand: p.brands ? p.brands.split(",")[0].trim() : "",
        calories: Math.round(p.nutriments["energy-kcal_100g"] || 0),
        protein: Math.round((p.nutriments["proteins_100g"] || 0) * 10) / 10,
        carbs: Math.round((p.nutriments["carbohydrates_100g"] || 0) * 10) / 10,
        fat: Math.round((p.nutriments["fat_100g"] || 0) * 10) / 10,
      }))
      .slice(0, 8);
    UI.modal = { type: "searchFood", query, results, loading: false, searched: true };
  } catch (err) {
    UI.modal = { type: "searchFood", query, results: [], loading: false, searched: true, error: "Couldn't reach the food database — check your connection and try again." };
  }
  render();
  attachFieldListeners();
}

function checkVoiceLogParam() {
  const params = new URLSearchParams(window.location.search);
  const transcript = params.get("voicelog");
  if (!transcript) return;

  const { matched, unmatched } = parseVoiceTranscript(transcript);
  UI.tab = "food";
  UI.modal = {
    type: "logMeal", query: "", picks: {}, listening: false,
    voiceTranscript: transcript, voiceUnmatched: unmatched,
    voiceMatchedIds: matched.map(m => m.foodId), voiceError: "",
  };
  matched.forEach(m => { UI.modal.picks[m.foodId] = String(m.servings); });

  // Clean the URL so refreshing the page doesn't re-process the same voice log
  window.history.replaceState({}, "", window.location.pathname);
}

render();
attachFieldListeners();
checkVoiceLogParam();
render();
attachFieldListeners();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {
      // Non-fatal: app still works without the service worker, just without
      // the install prompt / offline caching benefits.
    });
  });
}
